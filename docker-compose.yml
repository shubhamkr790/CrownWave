services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cronwave
      POSTGRES_PASSWORD: cronwave
      POSTGRES_DB: cronwave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cronwave"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cronwave:cronwave@postgres:5432/cronwave
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cronwave:cronwave@postgres:5432/cronwave
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cronwave:cronwave@postgres:5432/cronwave
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
